<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAMOUR | Secret Drop Matrix</title>
  <meta name="description" content="LAMOUR secret drop access portal." />
  <style>
    :root {
      --bg-0: #040405;
      --bg-1: #0b0c10;
      --bg-2: #11131a;
      --card: rgba(12, 14, 19, 0.78);
      --text: #f4f7ff;
      --muted: #98a2b3;
      --gold: #d4af37;
      --gold-soft: #f2d47b;
      --accent: #00ffd0;
      --danger: #ff4d6d;
      --ok: #20e3b2;
      --line: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
      --radius: 18px;
      --radius-sm: 12px;
      --mono: "JetBrains Mono", "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(212, 175, 55, 0.14), transparent 50%),
        radial-gradient(1000px 500px at 120% 20%, rgba(0, 255, 208, 0.08), transparent 45%),
        linear-gradient(180deg, var(--bg-1), var(--bg-0));
      overflow-x: hidden;
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100dvh;
      padding: 24px;
    }

    /* Subtle animated grid */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      mask-image: radial-gradient(circle at center, black 25%, transparent 80%);
      pointer-events: none;
      animation: drift 20s linear infinite;
    }

    @keyframes drift {
      from { transform: translateY(0px); }
      to { transform: translateY(30px); }
    }

    .panel {
      width: min(100%, 520px);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(130deg, rgba(212,175,55,0.45), rgba(0,255,208,0.2), rgba(212,175,55,0.2));
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: -1;
    }

    .header {
      padding: 24px 24px 10px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold-soft);
      border: 1px solid rgba(212,175,55,0.35);
      border-radius: 999px;
      padding: 6px 12px;
      margin-bottom: 12px;
      background: rgba(212,175,55,0.07);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 0.5; }
    }

    h1 {
      font-family: var(--mono);
      font-size: clamp(1.25rem, 2vw, 1.65rem);
      letter-spacing: 0.11em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .timer {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 0.95rem;
      color: var(--text);
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.03);
    }

    .timer strong {
      color: var(--accent);
      min-width: 5ch;
      text-align: center;
    }

    .content {
      padding: 20px 24px 24px;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-family: var(--mono);
    }

    .input-wrap {
      position: relative;
    }

    .prefix {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.95rem;
    }

    input[type="tel"] {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.35);
      color: var(--text);
      border-radius: var(--radius-sm);
      padding: 14px 14px 14px 54px;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s, box-shadow .2s, transform .12s;
      font-family: var(--mono);
      letter-spacing: 0.04em;
    }

    input[type="tel"]::placeholder {
      color: #7c8596;
      letter-spacing: 0.02em;
    }

    input[type="tel"]:focus {
      border-color: rgba(212,175,55,0.6);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.18);
    }

    .error {
      margin-top: 8px;
      min-height: 18px;
      color: var(--danger);
      font-size: 0.82rem;
      font-family: var(--mono);
    }

    .cta {
      width: 100%;
      border: 0;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(100deg, var(--gold), #f6d46e);
      color: #181204;
      cursor: pointer;
      transition: transform .12s ease, filter .2s ease, box-shadow .2s ease;
      box-shadow: 0 10px 30px rgba(212,175,55,0.28);
      font-family: var(--mono);
      position: relative;
      overflow: hidden;
    }

    .cta:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .cta:active { transform: translateY(0); }
    .cta[disabled] { cursor: not-allowed; filter: grayscale(0.2) brightness(0.8); }

    .cta .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: rgba(0,0,0,0.75);
      border-radius: 50%;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status {
      margin-top: 14px;
      border: 1px solid rgba(32,227,178,0.4);
      background: rgba(32,227,178,0.08);
      color: #9ff8e0;
      border-radius: 10px;
      padding: 12px;
      font-size: 0.88rem;
      font-family: var(--mono);
      display: none;
      text-align: center;
    }

    .status.show { display: block; }

    .foot {
      margin-top: 12px;
      text-align: center;
      color: #7d8697;
      font-size: 0.75rem;
      line-height: 1.4;
      font-family: var(--mono);
    }

    .sr-only {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 480px) {
      .header { padding: 18px 16px 10px; }
      .content { padding: 16px; }
      .subtitle { font-size: 0.88rem; }
      input[type="tel"], .cta { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <main class="panel" aria-labelledby="title">
    <section class="header">
      <div class="badge">
        <span class="dot" aria-hidden="true"></span>
        Live Priority Channel
      </div>
      <h1 id="title">LAMOUR • Secret Drop Matrix</h1>
      <p class="subtitle">
        Enter your mobile to unlock ₹99 inventory access. Session expires when timer reaches zero.
      </p>
      <div class="timer" role="timer" aria-live="polite" aria-atomic="true">
        Inventory reset in <strong id="countdown">60:00</strong>
      </div>
    </section>

    <section class="content">
      <form id="capture-form" novalidate>
        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <div class="input-wrap">
            <span class="prefix" aria-hidden="true">+91</span>
            <input
              type="tel"
              id="mobile"
              name="mobile"
              inputmode="numeric"
              autocomplete="tel-national"
              placeholder="10-digit mobile number"
              maxlength="10"
              required
              aria-describedby="mobile-error"
              aria-invalid="false"
            />
          </div>
          <p class="error" id="mobile-error" aria-live="polite"></p>
        </div>

        <button class="cta" type="submit" id="submitBtn">
          Initialize Access
        </button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite">
        [NUMBER LOGGED. AWAIT SMS INSTRUCTIONS.]
      </p>

      <p class="foot">
        By continuing, you agree to receive one-time verification messages.
      </p>
    </section>
  </main>

  <script>
    (() => {
      const form = document.getElementById('capture-form');
      const mobileInput = document.getElementById('mobile');
      const errorEl = document.getElementById('mobile-error');
      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');
      const countdownEl = document.getElementById('countdown');

      const SESSION_MINUTES = 60;
      const STORAGE_KEY = 'lamour_session_end';

      function sanitizeDigits(value) {
        return value.replace(/\D/g, '').slice(0, 10);
      }

      function validateIndianMobile(value) {
        // Valid Indian mobile: starts with 6-9 and total 10 digits
        return /^[6-9]\d{9}$/.test(value);
      }

      function setError(msg = '') {
        errorEl.textContent = msg;
        const hasError = !!msg;
        mobileInput.setAttribute('aria-invalid', String(hasError));
      }

      function setLoading(isLoading) {
        if (isLoading) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Processing...';
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Initialize Access';
        }
      }

      // Keep only digits while typing
      mobileInput.addEventListener('input', () => {
        mobileInput.value = sanitizeDigits(mobileInput.value);
        if (errorEl.textContent) setError('');
      });

      // Countdown logic with persistence
      function getOrCreateSessionEnd() {
        const now = Date.now();
        const existing = Number(localStorage.getItem(STORAGE_KEY));
        if (existing && existing > now) return existing;

        const end = now + SESSION_MINUTES * 60 * 1000;
        localStorage.setItem(STORAGE_KEY, String(end));
        return end;
      }

      function formatMMSS(ms) {
        const totalSec = Math.max(0, Math.floor(ms / 1000));
        const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
        const ss = String(totalSec % 60).padStart(2, '0');
        return `${mm}:${ss}`;
      }

      let sessionEnd = getOrCreateSessionEnd();

      const timer = setInterval(() => {
        const remaining = sessionEnd - Date.now();
        countdownEl.textContent = formatMMSS(remaining);

        if (remaining <= 0) {
          clearInterval(timer);
          countdownEl.textContent = '00:00';
          submitBtn.disabled = true;
          submitBtn.textContent = 'Session Expired';
          setError('Session expired. Refresh to start a new window.');
        }
      }, 250);

      // Simulated API submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        setError('');

        const digits = sanitizeDigits(mobileInput.value);
        if (!validateIndianMobile(digits)) {
          setError('Enter a valid 10-digit Indian mobile number (starts with 6–9).');
          return;
        }

        setLoading(true);

        try {
          // Replace this with your real endpoint
          // const res = await fetch('/api/capture', {
          //   method: 'POST',
          //   headers: { 'Content-Type': 'application/json' },
          //   body: JSON.stringify({ mobile: `+91${digits}` })
          // });
          // if (!res.ok) throw new Error('Network error');

          // Fake latency for demo:
          await new Promise(resolve => setTimeout(resolve, 1200));

          form.style.display = 'none';
          statusEl.classList.add('show');
        } catch (err) {
          setError('Unable to initialize access right now. Please try again.');
        } finally {
          setLoading(false);
        }
      });
    })();
  </script>
</body>
</html>
